name: Deploy to Vercel

# Production deploys come from main. Pull requests get a preview deployment so
# changes can be reviewed on a real URL before merging.
#
# Two ways to connect this repository to Vercel, pick one:
#
#   1. Git integration (recommended): install the Vercel GitHub App for this
#      repository. Vercel then deploys automatically on push and on pull
#      requests, and this workflow is not needed.
#   2. This workflow: add the secrets below and Vercel is driven from Actions.
#      Required repository secrets (Settings -> Secrets and variables ->
#      Actions):
#        VERCEL_TOKEN       Vercel personal access token
#        VERCEL_ORG_ID      team id, e.g. team_xxxxxxxx
#        VERCEL_PROJECT_ID  project id, e.g. prj_xxxxxxxx

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: vercel-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild the site
        run: python3 build.py

      - name: Check generated pages are committed
        # Generated HTML is committed. If a partial was edited without running
        # build.py, the deployed site would silently disagree with the source.
        run: |
          if ! git diff --quiet; then
            echo "::error::Generated pages are out of date. Run 'python3 build.py' and commit the result."
            git --no-pager diff --stat
            exit 1
          fi

      - name: Check internal links and assets
        run: |
          python3 -m http.server 8080 &
          sleep 2
          python3 tools/check_links.py

  # Job-level `if` may only read the github/needs/vars/inputs contexts, so the
  # presence of the Vercel token is detected here and consumed via `needs`.
  detect:
    name: Check deployment credentials
    runs-on: ubuntu-latest
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - id: check
        env:
          TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -n "$TOKEN" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::VERCEL_TOKEN is not set; skipping deployment. The verify job above still ran."
          fi

  deploy:
    name: ${{ github.event_name == 'pull_request' && 'Preview' || 'Production' }} deploy
    runs-on: ubuntu-latest
    needs: [verify, detect]
    if: needs.detect.outputs.configured == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel environment
        run: |
          vercel pull --yes \
            --environment=${{ github.event_name == 'pull_request' && 'preview' || 'production' }} \
            --token=${{ secrets.VERCEL_TOKEN }}

      - name: Refresh download fallback from the live release
        # The download page's no-JS fallback (version/size/SHA-256) has to match
        # the release the button points at, or a visitor is told to verify the
        # file against a digest that matches nothing. Refresh it here, then
        # rebuild so the committed HTML carries the new values. Non-fatal: if
        # GitHub is unreachable the page keeps its last-known values, which is
        # also what /api/release-info does at runtime.
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 tools/sync_release_fallback.py
          python3 build.py

      - name: Refresh the schedule of charges from the backend
        # The charges page quotes amounts the backend charges. Fetch them here so
        # the deployed page carries the live figures, then rebuild.
        #
        # On a push this is fatal on failure. A stale digest misleads a cautious
        # visitor; a stale price is a different kind of harm, because it is the
        # figure a member relies on when deciding what they can afford. If the
        # backend cannot be reached the deploy stops and the previous, correct
        # deployment stays live.
        #
        # On a pull request it only warns. A preview is a page to look at, not a
        # price anyone is charged, and a reviewer needs to see the page - so it
        # builds from the committed figures instead. The guarantee is kept where
        # it matters: the push to main still refuses to publish a stale price.
        run: |
          if python3 tools/sync_fee_schedule.py; then
            python3 build.py
            exit 0
          fi
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "::warning::Could not refresh the schedule of charges; this preview shows the last committed figures. The deploy to production will fail until the backend serves /api/v1/fees."
            python3 build.py
            exit 0
          fi
          echo "::error::Could not refresh the schedule of charges; refusing to deploy a price that may be stale."
          exit 1

      - name: Confirm the committed pages match the deployed data
        # After the refresh above, a diff means the repository's committed output
        # is behind the amounts actually being charged. Fail rather than deploy on
        # a push, so the committed tree never lags the published figures; warn on
        # a pull request, where the failure is for the author to fix before merge.
        run: |
          if git diff --quiet -- src/data/fee-schedule.json charges/; then
            exit 0
          fi
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "::warning::The committed schedule of charges is behind the backend. Run 'python3 tools/sync_fee_schedule.py && python3 build.py' and commit the result."
            git --no-pager diff --stat -- src/data/fee-schedule.json charges/
            exit 0
          fi
          echo "::error::The committed schedule of charges is behind the backend. Run 'python3 tools/sync_fee_schedule.py && python3 build.py' and commit the result."
          git --no-pager diff --stat -- src/data/fee-schedule.json charges/
          exit 1

      - name: Build project artifacts
        run: vercel build ${{ github.event_name != 'pull_request' && '--prod' || '' }} --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to Vercel
        id: deploy
        run: |
          url=$(vercel deploy --prebuilt ${{ github.event_name != 'pull_request' && '--prod' || '' }} --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed to $url"

      - name: Summarise
        run: |
          {
            echo "### Deployment"
            echo ""
            echo "- Environment: ${{ github.event_name == 'pull_request' && 'preview' || 'production' }}"
            echo "- URL: ${{ steps.deploy.outputs.url }}"
          } >> "$GITHUB_STEP_SUMMARY"
