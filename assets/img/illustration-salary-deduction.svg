<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" role="img" aria-labelledby="sd-title sd-desc" width="480" height="360">
  <title id="sd-title">How salary deduction works</title>
  <desc id="sd-desc">A cycle: the employer deducts the member's contribution during payroll, remits it to Coopvest, and the member's contribution record is credited the same day.</desc>

  <style>
    .fade { animation: fade .8s ease both; }
    @keyframes fade { from { opacity: 0 } to { opacity: 1 } }
    .d1{animation-delay:.1s}.d2{animation-delay:.3s}.d3{animation-delay:.5s}.d4{animation-delay:.7s}
    .flow { stroke-dasharray: 9 11; animation: dash 1.7s linear infinite; }
    @keyframes dash { to { stroke-dashoffset: -40; } }
    .coin { animation: rise 3.2s ease-in-out infinite; }
    .coin2 { animation: rise 3.2s ease-in-out 1.05s infinite; }
    @keyframes rise {
      0%   { opacity: 0; transform: translateX(-6px) scale(.85); }
      20%  { opacity: 1; transform: translateX(0) scale(1); }
      75%  { opacity: 1; transform: translateX(6px) scale(1); }
      100% { opacity: 0; transform: translateX(12px) scale(.9); }
    }
    .bar { transform-origin: bottom; animation: grow 1.1s cubic-bezier(.2,.7,.3,1) both; }
    @keyframes grow { from { transform: scaleY(0) } to { transform: scaleY(1) } }
    .b1{animation-delay:.6s}.b2{animation-delay:.75s}.b3{animation-delay:.9s}.b4{animation-delay:1.05s}
    @media (prefers-reduced-motion: reduce) {
      .fade,.flow,.coin,.coin2,.bar { animation: none; }
      .coin,.coin2 { opacity: 1; }
    }
  </style>

  <defs>
    <linearGradient id="sdBrand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2e7d32"/>
      <stop offset="0.55" stop-color="#1b5e20"/>
      <stop offset="1" stop-color="#0f3d14"/>
    </linearGradient>
    <linearGradient id="sdGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f2b705"/>
      <stop offset="1" stop-color="#dba400"/>
    </linearGradient>
    <filter id="sdSh" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#101b16" flood-opacity="0.12"/>
    </filter>
    <marker id="sdArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#a9ccb5"/>
    </marker>
  </defs>

  <!-- stage 1: employer payroll -->
  <g class="fade d1" filter="url(#sdSh)">
    <rect x="14" y="66" width="146" height="150" rx="18" fill="#ffffff" stroke="#e3eae6"/>
    <rect x="32" y="86" width="34" height="34" rx="10" fill="#e3f1eb"/>
    <path d="M41 96h16M41 103h16M41 110h9" stroke="#1b5e20" stroke-width="2" stroke-linecap="round"/>
    <text x="32" y="142" font-family="Inter, system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#101b16">Employer payroll</text>
    <text x="32" y="160" font-family="Inter, system-ui, sans-serif" font-size="10.5" fill="#5c6b64">Your contribution is</text>
    <text x="32" y="174" font-family="Inter, system-ui, sans-serif" font-size="10.5" fill="#5c6b64">deducted from salary</text>
    <rect x="32" y="188" width="52" height="16" rx="8" fill="#eef3f0"/>
    <text x="58" y="200" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="9" font-weight="700" fill="#5c6b64">MONTHLY</text>
  </g>

  <!-- stage 2: coopvest engine -->
  <g class="fade d3" filter="url(#sdSh)">
    <rect x="192" y="48" width="96" height="186" rx="18" fill="url(#sdBrand)"/>
    <circle cx="268" cy="70" r="28" fill="#ffffff" opacity="0.07"/>
    <text x="240" y="82" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="700" fill="#ffffff">Coopvest</text>
    <text x="240" y="96" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="9" fill="#cde5db">remits &amp; reconciles</text>
    <circle cx="240" cy="130" r="22" fill="#ffffff" opacity="0.10"/>
    <path d="M232 130h16M240 122v16" stroke="#f2b705" stroke-width="2.6" stroke-linecap="round"/>
    <text x="240" y="176" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="9.5" fill="#cde5db">Credited the</text>
    <text x="240" y="190" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="9.5" fill="#cde5db">same day</text>
    <circle class="coin"  cx="240" cy="212" r="8" fill="url(#sdGold)"/>
    <circle class="coin2" cx="240" cy="212" r="6" fill="#ffffff" opacity="0.4"/>
  </g>

  <!-- stage 3: member record -->
  <g class="fade d4" filter="url(#sdSh)">
    <rect x="320" y="66" width="146" height="150" rx="18" fill="#ffffff" stroke="#e3eae6"/>
    <text x="338" y="92" font-family="Inter, system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#101b16">Your record</text>
    <text x="338" y="108" font-family="Inter, system-ui, sans-serif" font-size="10.5" fill="#5c6b64">Updated automatically</text>
    <rect class="bar b1" x="338" y="168" width="18" height="28" rx="4" fill="#a9ccb5"/>
    <rect class="bar b2" x="364" y="152" width="18" height="44" rx="4" fill="#81c784"/>
    <rect class="bar b3" x="390" y="138" width="18" height="58" rx="4" fill="#2e7d32"/>
    <rect class="bar b4" x="416" y="124" width="18" height="72" rx="4" fill="url(#sdGold)"/>
    <line x1="338" y1="196" x2="444" y2="196" stroke="#e3eae6"/>
  </g>

  <!-- flow connectors -->
  <path class="flow" d="M160 140H190" fill="none" stroke="#a9ccb5" stroke-width="2.4" stroke-linecap="round" marker-end="url(#sdArrow)"/>
  <path class="flow" d="M288 140H318" fill="none" stroke="#a9ccb5" stroke-width="2.4" stroke-linecap="round" marker-end="url(#sdArrow)"/>

  <!-- caption chips -->
  <g class="fade d4">
    <rect x="14" y="252" width="452" height="1" fill="#e3eae6"/>
    <rect x="14" y="292" width="140" height="34" rx="10" fill="#eef3f0"/>
    <circle cx="34" cy="309" r="4" fill="#1b5e20"/>
    <text x="46" y="313" font-family="Inter, system-ui, sans-serif" font-size="10.5" font-weight="600" fill="#101b16">Payroll stays yours</text>
    <rect x="170" y="292" width="140" height="34" rx="10" fill="#fff1c2"/>
    <circle cx="190" cy="309" r="4" fill="#8a6300"/>
    <text x="202" y="313" font-family="Inter, system-ui, sans-serif" font-size="10.5" font-weight="600" fill="#8a6300">Auditable remittance</text>
    <rect x="326" y="292" width="140" height="34" rx="10" fill="#eef3f0"/>
    <circle cx="346" cy="309" r="4" fill="#1b5e20"/>
    <text x="358" y="313" font-family="Inter, system-ui, sans-serif" font-size="10.5" font-weight="600" fill="#101b16">No new systems</text>
  </g>
</svg>
