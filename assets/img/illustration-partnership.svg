<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 420" role="img" aria-labelledby="part-title part-desc" width="520" height="420">
  <title id="part-title">How salary deduction works</title>
  <desc id="part-desc">A three-stage flow: employer payroll, the Coopvest deduction engine, and the member's contribution record.</desc>

  <style>
    .fade { animation: fade .8s ease both; }
    @keyframes fade { from { opacity: 0 } to { opacity: 1 } }
    .d1{animation-delay:.15s}.d2{animation-delay:.3s}.d3{animation-delay:.45s}
    .d4{animation-delay:.6s}.d5{animation-delay:.8s}.d6{animation-delay:1s}
    .flow { stroke-dasharray: 10 12; animation: dash 1.6s linear infinite; }
    @keyframes dash { to { stroke-dashoffset: -44; } }
    .coin { animation: rise-coin 3.4s ease-in-out infinite; }
    .coin2 { animation: rise-coin 3.4s ease-in-out .9s infinite; }
    .coin3 { animation: rise-coin 3.4s ease-in-out 1.8s infinite; }
    @keyframes rise-coin {
      0%   { opacity: 0; transform: translateY(14px) scale(.85); }
      18%  { opacity: 1; transform: translateY(0) scale(1); }
      76%  { opacity: 1; transform: translateY(-6px) scale(1); }
      100% { opacity: 0; transform: translateY(-18px) scale(.9); }
    }
    .bar { transform-origin: bottom; animation: grow 1.2s cubic-bezier(.2,.7,.3,1) both; }
    @keyframes grow { from { transform: scaleY(0) } to { transform: scaleY(1) } }
    .b1{animation-delay:.7s}.b2{animation-delay:.85s}.b3{animation-delay:1s}.b4{animation-delay:1.15s}
    .ping { animation: ping 2.8s ease-out infinite; }
    @keyframes ping { 0% { r: 8; opacity: .5 } 70%,100% { r: 26; opacity: 0 } }
    @media (prefers-reduced-motion: reduce) {
      .fade,.flow,.coin,.coin2,.coin3,.bar,.ping { animation: none; }
      .coin,.coin2,.coin3 { opacity: 1; }
    }
  </style>

  <defs>
    <linearGradient id="pBrand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2e7d32"/>
      <stop offset="0.55" stop-color="#1b5e20"/>
      <stop offset="1" stop-color="#0f3d14"/>
    </linearGradient>
    <linearGradient id="pGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f2b705"/>
      <stop offset="1" stop-color="#dba400"/>
    </linearGradient>
    <filter id="pSh" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#101b16" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- connectors -->
  <path class="flow" d="M168 148H210" fill="none" stroke="#a9ccb5" stroke-width="2.4" stroke-linecap="round"/>
  <path class="flow" d="M312 148H354" fill="none" stroke="#a9ccb5" stroke-width="2.4" stroke-linecap="round"/>

  <!-- stage 1: employer payroll -->
  <g class="fade d1" filter="url(#pSh)">
    <rect x="16" y="72" width="152" height="152" rx="18" fill="#ffffff" stroke="#e3eae6"/>
    <rect x="36" y="94" width="34" height="34" rx="10" fill="#e3f1eb"/>
    <path d="M45 104h16M45 111h16M45 118h9" stroke="#1b5e20" stroke-width="2" stroke-linecap="round"/>
    <text x="36" y="152" font-family="Inter, system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#101b16">Employer payroll</text>
    <text x="36" y="170" font-family="Inter, system-ui, sans-serif" font-size="10.5" fill="#5c6b64">Deduction authorised</text>
    <text x="36" y="186" font-family="Inter, system-ui, sans-serif" font-size="10.5" fill="#5c6b64">per employee, per cycle</text>
    <rect x="36" y="198" width="52" height="16" rx="8" fill="#eef3f0"/>
    <text x="62" y="210" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="9" font-weight="700" fill="#5c6b64">MONTHLY</text>
  </g>

  <!-- stage 2: deduction engine -->
  <g class="fade d3" filter="url(#pSh)">
    <rect x="210" y="52" width="102" height="192" rx="18" fill="url(#pBrand)"/>
    <circle cx="292" cy="76" r="30" fill="#ffffff" opacity="0.07"/>
    <text x="261" y="88" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="700" fill="#ffffff">Coopvest</text>
    <text x="261" y="102" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="9" fill="#cde5db">engine</text>
    <circle cx="261" cy="138" r="24" fill="#ffffff" opacity="0.10"/>
    <circle class="ping" cx="261" cy="138" r="8" fill="#f2b705" opacity="0.5"/>
    <path d="M253 138h16M261 130v16" stroke="#f2b705" stroke-width="2.6" stroke-linecap="round"/>
    <text x="261" y="188" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="9.5" fill="#cde5db">Reconciles every</text>
    <text x="261" y="202" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="9.5" fill="#cde5db">naira, same day</text>
    <g>
      <circle class="coin"  cx="261" cy="226" r="9" fill="url(#pGold)"/>
      <circle class="coin2" cx="237" cy="226" r="7" fill="#ffffff" opacity="0.35"/>
      <circle class="coin3" cx="285" cy="226" r="7" fill="#ffffff" opacity="0.35"/>
    </g>
  </g>

  <!-- stage 3: member record -->
  <g class="fade d5" filter="url(#pSh)">
    <rect x="354" y="72" width="150" height="152" rx="18" fill="#ffffff" stroke="#e3eae6"/>
    <text x="374" y="100" font-family="Inter, system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#101b16">Member record</text>
    <text x="374" y="117" font-family="Inter, system-ui, sans-serif" font-size="10.5" fill="#5c6b64">Updated automatically</text>
    <!-- mini bar chart -->
    <g>
      <rect class="bar b1" x="374" y="176" width="18" height="28" rx="4" fill="#a9ccb5"/>
      <rect class="bar b2" x="400" y="160" width="18" height="44" rx="4" fill="#81c784"/>
      <rect class="bar b3" x="426" y="146" width="18" height="58" rx="4" fill="#2e7d32"/>
      <rect class="bar b4" x="452" y="132" width="18" height="72" rx="4" fill="url(#pGold)"/>
    </g>
    <line x1="374" y1="204" x2="482" y2="204" stroke="#e3eae6"/>
  </g>

  <!-- caption chips -->
  <g class="fade d6">
    <rect x="16" y="256" width="488" height="1" fill="#e3eae6"/>
    <rect x="16" y="300" width="150" height="34" rx="10" fill="#eef3f0"/>
    <circle cx="36" cy="317" r="4" fill="#1b5e20"/>
    <text x="48" y="321" font-family="Inter, system-ui, sans-serif" font-size="10.5" font-weight="600" fill="#101b16">Payroll stays yours</text>
    <rect x="182" y="300" width="150" height="34" rx="10" fill="#fff1c2"/>
    <circle cx="202" cy="317" r="4" fill="#8a6300"/>
    <text x="214" y="321" font-family="Inter, system-ui, sans-serif" font-size="10.5" font-weight="600" fill="#8a6300">Auditable remittance</text>
    <rect x="348" y="300" width="156" height="34" rx="10" fill="#eef3f0"/>
    <circle cx="368" cy="317" r="4" fill="#1b5e20"/>
    <text x="380" y="321" font-family="Inter, system-ui, sans-serif" font-size="10.5" font-weight="600" fill="#101b16">No new systems</text>
  </g>

  <text x="260" y="378" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11.5" fill="#5c6b64">You authorise a deduction. We handle the member records, verification and servicing.</text>
</svg>
