<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" role="img" aria-labelledby="dd-title dd-desc" width="480" height="360">
  <title id="dd-title">How direct deposit works</title>
  <desc id="dd-desc">A member pays their own contribution by bank transfer, card or USSD into a Coopvest account, and the same savings record and loan eligibility are built, with no employment details needed.</desc>

  <style>
    .fade { animation: fade .8s ease both; }
    @keyframes fade { from { opacity: 0 } to { opacity: 1 } }
    .d1{animation-delay:.1s}.d2{animation-delay:.35s}.d3{animation-delay:.6s}.d4{animation-delay:.85s}
    .ping { animation: ping 2.6s ease-out infinite; }
    @keyframes ping { 0% { r: 7; opacity: .55 } 70%,100% { r: 24; opacity: 0 } }
    .bar { transform-origin: bottom; animation: grow 1.1s cubic-bezier(.2,.7,.3,1) both; }
    @keyframes grow { from { transform: scaleY(0) } to { transform: scaleY(1) } }
    .b1{animation-delay:.6s}.b2{animation-delay:.75s}.b3{animation-delay:.9s}.b4{animation-delay:1.05s}
    .dash { stroke-dasharray: 6 8; animation: march 1.4s linear infinite; }
    @keyframes march { to { stroke-dashoffset: -28; } }
    @media (prefers-reduced-motion: reduce) {
      .fade,.ping,.bar,.dash { animation: none; }
    }
  </style>

  <defs>
    <linearGradient id="ddBrand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2e7d32"/>
      <stop offset="0.55" stop-color="#1b5e20"/>
      <stop offset="1" stop-color="#0f3d14"/>
    </linearGradient>
    <linearGradient id="ddGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f2b705"/>
      <stop offset="1" stop-color="#dba400"/>
    </linearGradient>
    <filter id="ddSh" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#101b16" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- stage 1: member pays -->
  <g class="fade d1" filter="url(#ddSh)">
    <rect x="14" y="70" width="150" height="146" rx="18" fill="#ffffff" stroke="#e3eae6"/>
    <rect x="30" y="88" width="58" height="96" rx="12" fill="#0f1311"/>
    <rect x="35" y="96" width="48" height="80" rx="6" fill="#173a24"/>
    <circle cx="59" cy="146" r="14" fill="#ffffff" opacity="0.12"/>
    <text x="59" y="150" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="700" fill="#f2b705">&#8358;</text>
    <circle cx="59" cy="186" r="3" fill="#3b4a43"/>
    <text x="98" y="108" font-family="Inter, system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#101b16">You pay in</text>
    <text x="98" y="124" font-family="Inter, system-ui, sans-serif" font-size="9.5" fill="#5c6b64">Bank transfer</text>
    <text x="98" y="138" font-family="Inter, system-ui, sans-serif" font-size="9.5" fill="#5c6b64">Card</text>
    <text x="98" y="152" font-family="Inter, system-ui, sans-serif" font-size="9.5" fill="#5c6b64">USSD</text>
    <rect x="98" y="164" width="52" height="16" rx="8" fill="#eef3f0"/>
    <text x="124" y="176" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="8.5" font-weight="700" fill="#5c6b64">ANY AMOUNT</text>
  </g>

  <!-- stage 2: account credited -->
  <g class="fade d2" filter="url(#ddSh)">
    <rect x="192" y="52" width="96" height="182" rx="18" fill="url(#ddBrand)"/>
    <circle cx="240" cy="86" r="20" fill="#ffffff" opacity="0.10"/>
    <circle class="ping" cx="240" cy="86" r="7" fill="#f2b705" opacity="0.5"/>
    <path d="M233 86h14M240 79v14" stroke="#f2b705" stroke-width="2.4" stroke-linecap="round"/>
    <text x="240" y="128" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#ffffff">Recorded</text>
    <text x="240" y="143" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="9.5" fill="#cde5db">the moment</text>
    <text x="240" y="157" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="9.5" fill="#cde5db">it lands</text>
    <circle cx="240" cy="188" r="8" fill="url(#ddGold)"/>
    <circle cx="240" cy="188" r="3" fill="#8a6300"/>
    <text x="240" y="216" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="8.5" fill="#cde5db">Date · amount · reference</text>
  </g>

  <!-- stage 3: same record -->
  <g class="fade d3" filter="url(#ddSh)">
    <rect x="320" y="70" width="146" height="146" rx="18" fill="#ffffff" stroke="#e3eae6"/>
    <text x="338" y="96" font-family="Inter, system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#101b16">Same savings record</text>
    <text x="338" y="112" font-family="Inter, system-ui, sans-serif" font-size="10.5" fill="#5c6b64">No employment details</text>
    <rect class="bar b1" x="338" y="170" width="18" height="26" rx="4" fill="#a9ccb5"/>
    <rect class="bar b2" x="364" y="156" width="18" height="40" rx="4" fill="#81c784"/>
    <rect class="bar b3" x="390" y="142" width="18" height="54" rx="4" fill="#2e7d32"/>
    <rect class="bar b4" x="416" y="128" width="18" height="68" rx="4" fill="url(#ddGold)"/>
    <line x1="338" y1="196" x2="444" y2="196" stroke="#e3eae6"/>
  </g>

  <!-- flow -->
  <path class="dash" d="M164 143H190" fill="none" stroke="#a9ccb5" stroke-width="2.4" stroke-linecap="round"/>
  <path class="dash" d="M288 143H318" fill="none" stroke="#a9ccb5" stroke-width="2.4" stroke-linecap="round"/>

  <!-- caption chips -->
  <g class="fade d4">
    <rect x="14" y="252" width="452" height="1" fill="#e3eae6"/>
    <rect x="14" y="292" width="140" height="34" rx="10" fill="#eef3f0"/>
    <circle cx="34" cy="309" r="4" fill="#1b5e20"/>
    <text x="46" y="313" font-family="Inter, system-ui, sans-serif" font-size="10.5" font-weight="600" fill="#101b16">No employer needed</text>
    <rect x="170" y="292" width="140" height="34" rx="10" fill="#fff1c2"/>
    <circle cx="190" cy="309" r="4" fill="#8a6300"/>
    <text x="202" y="313" font-family="Inter, system-ui, sans-serif" font-size="10.5" font-weight="600" fill="#8a6300">Builds eligibility</text>
    <rect x="326" y="292" width="140" height="34" rx="10" fill="#eef3f0"/>
    <circle cx="346" cy="309" r="4" fill="#1b5e20"/>
    <text x="358" y="313" font-family="Inter, system-ui, sans-serif" font-size="10.5" font-weight="600" fill="#101b16">Switch any time</text>
  </g>
</svg>
