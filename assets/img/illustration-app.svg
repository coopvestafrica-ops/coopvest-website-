<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 680" role="img" aria-labelledby="appmock-title appmock-desc" width="340" height="680">
  <title id="appmock-title">The Coopvest member app</title>
  <desc id="appmock-desc">A phone showing the member dashboard: savings balance, contribution growth chart and recent activity.</desc>

  <style>
    .float { animation: float 6s ease-in-out infinite; }
    @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
    .rise { animation: rise 0.7s cubic-bezier(.2,.7,.3,1) both; }
    @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
    .d1 { animation-delay: .25s } .d2 { animation-delay: .4s } .d3 { animation-delay: .55s }
    .d4 { animation-delay: .7s } .d5 { animation-delay: .85s } .d6 { animation-delay: 1s }
    .bar { transform-origin: bottom; animation: grow 1.1s cubic-bezier(.2,.7,.3,1) both; }
    @keyframes grow { from { transform: scaleY(0); } to { transform: scaleY(1); } }
    .b1 { animation-delay: .6s } .b2 { animation-delay: .72s } .b3 { animation-delay: .84s }
    .b4 { animation-delay: .96s } .b5 { animation-delay: 1.08s } .b6 { animation-delay: 1.2s }
    .spark { stroke-dasharray: 420; stroke-dashoffset: 420; animation: draw 2s .8s ease-out forwards; }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    .dot { animation: pop 0.5s 2.6s cubic-bezier(.3,1.6,.5,1) both; }
    @keyframes pop { from { opacity: 0; transform: scale(0); } to { opacity: 1; transform: scale(1); } }
    .pulse { animation: pulse 2.6s 1s ease-out infinite; }
    @keyframes pulse { 0% { r: 5; opacity: .55 } 70%,100% { r: 16; opacity: 0 } }
    @media (prefers-reduced-motion: reduce) {
      .float,.rise,.bar,.dot,.pulse { animation: none; }
      .spark { stroke-dashoffset: 0; }
    }
  </style>

  <defs>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f5f7f6"/>
    </linearGradient>
    <linearGradient id="wallet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2e7d32"/>
      <stop offset="0.55" stop-color="#1b5e20"/>
      <stop offset="1" stop-color="#0f3d14"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f2b705"/>
      <stop offset="1" stop-color="#dba400"/>
    </linearGradient>
    <clipPath id="screenClip">
      <rect x="24" y="24" width="292" height="632" rx="30"/>
    </clipPath>
    <filter id="cardShadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#101b16" flood-opacity="0.10"/>
    </filter>
    <filter id="phoneShadow" x="-40%" y="-20%" width="180%" height="150%">
      <feDropShadow dx="0" dy="24" stdDeviation="24" flood-color="#0f3d14" flood-opacity="0.28"/>
    </filter>
  </defs>

  <g class="float">
    <!-- device -->
    <rect x="8" y="8" width="324" height="664" rx="46" fill="#101b16" filter="url(#phoneShadow)"/>
    <rect x="14" y="14" width="312" height="652" rx="42" fill="#1a211d"/>
    <rect x="24" y="24" width="292" height="632" rx="30" fill="url(#screen)"/>

    <g clip-path="url(#screenClip)">
      <!-- status bar -->
      <rect x="24" y="24" width="292" height="26" fill="#ffffff"/>
      <rect x="150" y="30" width="40" height="9" rx="4.5" fill="#101b16" opacity="0.85"/>
      <text x="42" y="41" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="600" fill="#101b16">9:41</text>
      <rect x="276" y="33" width="16" height="8" rx="2.5" fill="#101b16" opacity="0.7"/>
      <rect x="296" y="33" width="9" height="8" rx="2" fill="#101b16" opacity="0.45"/>

      <!-- app bar -->
      <g class="rise d1">
        <circle cx="50" cy="76" r="15" fill="#e3f1eb"/>
        <circle cx="50" cy="71" r="5.4" fill="#1b5e20"/>
        <path d="M40 86c1.6-5 5.4-7.5 10-7.5S58.4 81 60 86z" fill="#1b5e20"/>
        <text x="74" y="72" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#5c6b64">Good morning</text>
        <text x="74" y="87" font-family="Inter, system-ui, sans-serif" font-size="13.5" font-weight="700" fill="#101b16">Adaeze</text>
        <circle cx="296" cy="76" r="13" fill="#eef3f0"/>
        <path d="M296 69.5a3.4 3.4 0 0 1 3.4 3.4c0 3-3.4 6.1-3.4 6.1s-3.4-3.1-3.4-6.1A3.4 3.4 0 0 1 296 69.5z" fill="none" stroke="#1b5e20" stroke-width="1.5"/>
      </g>

      <!-- balance card -->
      <g class="rise d2" filter="url(#cardShadow)">
        <rect x="42" y="104" width="256" height="128" rx="18" fill="url(#wallet)"/>
        <circle cx="272" cy="132" r="46" fill="#ffffff" opacity="0.07"/>
        <circle cx="248" cy="212" r="34" fill="#ffffff" opacity="0.05"/>
        <text x="60" y="132" font-family="Inter, system-ui, sans-serif" font-size="10" letter-spacing=".08em" fill="#cde5db">TOTAL SAVINGS</text>
        <text x="60" y="162" font-family="Inter, system-ui, sans-serif" font-size="27" font-weight="700" fill="#ffffff">&#8358;1,284,500</text>
        <circle cx="64" cy="188" r="3" fill="#f2b705"/>
        <text x="74" y="192" font-family="Inter, system-ui, sans-serif" font-size="10.5" fill="#cde5db">+&#8358;52,000 this month</text>
        <rect x="60" y="206" width="86" height="18" rx="9" fill="#f2b705"/>
        <text x="103" y="219" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="700" fill="#3d2e00">Contribute</text>
      </g>

      <!-- chart card -->
      <g class="rise d3" filter="url(#cardShadow)">
        <rect x="42" y="244" width="256" height="150" rx="16" fill="#ffffff" stroke="#e3eae6"/>
        <text x="58" y="270" font-family="Inter, system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#101b16">Contribution growth</text>
        <text x="58" y="285" font-family="Inter, system-ui, sans-serif" font-size="9.5" fill="#5c6b64">Last 6 months</text>
        <g>
          <rect class="bar b1" x="60"  y="352" width="20" height="22" rx="5" fill="#a9ccb5"/>
          <rect class="bar b2" x="94"  y="340" width="20" height="34" rx="5" fill="#a9ccb5"/>
          <rect class="bar b3" x="128" y="326" width="20" height="48" rx="5" fill="#81c784"/>
          <rect class="bar b4" x="162" y="316" width="20" height="58" rx="5" fill="#4caf50"/>
          <rect class="bar b5" x="196" y="302" width="20" height="72" rx="5" fill="#2e7d32"/>
          <rect class="bar b6" x="230" y="292" width="20" height="82" rx="5" fill="url(#gold)"/>
        </g>
        <line x1="58" y1="374" x2="282" y2="374" stroke="#e3eae6"/>
      </g>

      <!-- activity rows -->
      <g class="rise d4">
        <text x="58" y="424" font-family="Inter, system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#101b16">Recent activity</text>
      </g>
      <g class="rise d4">
        <rect x="42" y="436" width="256" height="46" rx="12" fill="#ffffff" stroke="#e3eae6"/>
        <rect x="56" y="449" width="20" height="20" rx="10" fill="#e3f1eb"/>
        <path d="M61 459.5l3.5 3.5 6-7" fill="none" stroke="#1b5e20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="86" y="456" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600" fill="#101b16">Salary contribution</text>
        <text x="86" y="470" font-family="Inter, system-ui, sans-serif" font-size="9" fill="#93a29b">12 Aug &#183; Ref CV-88214</text>
        <text x="282" y="464" text-anchor="end" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="700" fill="#15803d">+&#8358;52,000</text>
      </g>
      <g class="rise d5">
        <rect x="42" y="490" width="256" height="46" rx="12" fill="#ffffff" stroke="#e3eae6"/>
        <rect x="56" y="503" width="20" height="20" rx="10" fill="#dcfce7"/>
        <path d="M66 508v10M61 513h10" fill="none" stroke="#15803d" stroke-width="2" stroke-linecap="round"/>
        <text x="86" y="510" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600" fill="#101b16">Loan repayment</text>
        <text x="86" y="524" font-family="Inter, system-ui, sans-serif" font-size="9" fill="#93a29b">02 Aug &#183; Ref LN-40119</text>
        <text x="282" y="518" text-anchor="end" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="700" fill="#101b16">&#8358;38,400</text>
      </g>
      <g class="rise d6">
        <rect x="42" y="544" width="256" height="46" rx="12" fill="#ffffff" stroke="#e3eae6"/>
        <rect x="56" y="557" width="20" height="20" rx="10" fill="#fef3c7"/>
        <circle cx="66" cy="567" r="4.5" fill="none" stroke="#b45309" stroke-width="2"/>
        <path d="M66 564.5v3l2 1.5" fill="none" stroke="#b45309" stroke-width="1.8" stroke-linecap="round"/>
        <text x="86" y="564" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600" fill="#101b16">KYC verification</text>
        <text x="86" y="578" font-family="Inter, system-ui, sans-serif" font-size="9" fill="#93a29b">Pending review</text>
        <text x="282" y="572" text-anchor="end" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="700" fill="#b45309">Pending</text>
      </g>

      <!-- tab bar -->
      <g class="rise d6">
        <rect x="24" y="608" width="292" height="48" fill="#ffffff"/>
        <line x1="24" y1="608" x2="316" y2="608" stroke="#e3eae6"/>
        <rect x="52" y="622" width="22" height="18" rx="3" fill="none" stroke="#1b5e20" stroke-width="1.9"/>
        <path d="M74 626H52v-4l11-7 11 7z" fill="#1b5e20" opacity="0.15"/>
        <circle cx="126" cy="630" r="8" fill="none" stroke="#93a29b" stroke-width="1.9"/>
        <path d="M170 622v16M162 630h16" fill="none" stroke="#93a29b" stroke-width="1.9" stroke-linecap="round"/>
        <path d="M214 638a8 8 0 0 1 16 0z" fill="none" stroke="#93a29b" stroke-width="1.9"/>
        <circle cx="222" cy="624" r="4" fill="none" stroke="#93a29b" stroke-width="1.9"/>
        <path d="M276 624h22M276 630h22M276 636h14" stroke="#93a29b" stroke-width="1.9" stroke-linecap="round"/>
      </g>
    </g>

    <!-- screen edge highlight -->
    <rect x="24" y="24" width="292" height="632" rx="30" fill="none" stroke="#0f1311" stroke-opacity="0.06"/>
  </g>
</svg>
