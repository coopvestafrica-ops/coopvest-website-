<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380" role="img" aria-labelledby="lj-title lj-desc" width="520" height="380">
  <title id="lj-title">The loan journey</title>
  <desc id="lj-desc">Five stages of a loan: six months of contributions, identity verification, three guarantors accepting a QR request, an offer with a fixed schedule, and repayment to a cleared balance.</desc>

  <style>
    .fade { animation: fade .7s ease both; }
    @keyframes fade { from { opacity: 0 } to { opacity: 1 } }
    .n1{animation-delay:.1s}.n2{animation-delay:.35s}.n3{animation-delay:.6s}.n4{animation-delay:.85s}.n5{animation-delay:1.1s}
    .flow { stroke-dasharray: 9 11; animation: dash 1.7s linear infinite; }
    @keyframes dash { to { stroke-dashoffset: -40; } }
    @media (prefers-reduced-motion: reduce) { .fade,.flow { animation: none; } }
  </style>

  <defs>
    <linearGradient id="ljBrand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2e7d32"/>
      <stop offset="0.55" stop-color="#1b5e20"/>
      <stop offset="1" stop-color="#0f3d14"/>
    </linearGradient>
    <linearGradient id="ljGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f2b705"/>
      <stop offset="1" stop-color="#dba400"/>
    </linearGradient>
    <filter id="ljSh" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#101b16" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- spine -->
  <path class="flow" d="M84 66 V318" fill="none" stroke="#a9ccb5" stroke-width="2.4" stroke-linecap="round"/>

  <!-- stage 1 -->
  <g class="fade n1">
    <circle cx="84" cy="66" r="17" fill="url(#ljBrand)" filter="url(#ljSh)"/>
    <text x="84" y="71" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" fill="#ffffff">1</text>
    <text x="118" y="60" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" fill="#101b16">Six months of contributions</text>
    <text x="118" y="78" font-family="Inter, system-ui, sans-serif" font-size="10.5" fill="#5c6b64">One contribution in each of six consecutive months.</text>
  </g>

  <!-- stage 2 -->
  <g class="fade n2">
    <circle cx="84" cy="130" r="17" fill="url(#ljBrand)" filter="url(#ljSh)"/>
    <text x="84" y="135" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" fill="#ffffff">2</text>
    <text x="118" y="124" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" fill="#101b16">Identity verified</text>
    <text x="118" y="142" font-family="Inter, system-ui, sans-serif" font-size="10.5" fill="#5c6b64">KYC complete, membership active.</text>
  </g>

  <!-- stage 3 -->
  <g class="fade n3">
    <circle cx="84" cy="194" r="17" fill="url(#ljBrand)" filter="url(#ljSh)"/>
    <text x="84" y="199" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" fill="#ffffff">3</text>
    <text x="118" y="188" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" fill="#101b16">Three guarantors accept</text>
    <text x="118" y="206" font-family="Inter, system-ui, sans-serif" font-size="10.5" fill="#5c6b64">You share a QR code; each guarantor accepts in turn.</text>
    <!-- mini QR -->
    <g transform="translate(430 176)">
      <rect x="0" y="0" width="42" height="42" rx="7" fill="#ffffff" stroke="#e3eae6"/>
      <rect x="6" y="6" width="12" height="12" rx="2" fill="#0f3d14"/>
      <rect x="24" y="6" width="12" height="12" rx="2" fill="#0f3d14"/>
      <rect x="6" y="24" width="12" height="12" rx="2" fill="#0f3d14"/>
      <rect x="24" y="24" width="5" height="5" fill="#0f3d14"/>
      <rect x="31" y="31" width="5" height="5" fill="#0f3d14"/>
    </g>
  </g>

  <!-- stage 4 -->
  <g class="fade n4">
    <circle cx="84" cy="258" r="17" fill="url(#ljGold)" filter="url(#ljSh)"/>
    <text x="84" y="263" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" fill="#4a3600">4</text>
    <text x="118" y="252" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" fill="#101b16">Offer and schedule</text>
    <text x="118" y="270" font-family="Inter, system-ui, sans-serif" font-size="10.5" fill="#5c6b64">Rate, total cost and monthly repayment shown before you accept.</text>
  </g>

  <!-- stage 5 -->
  <g class="fade n5">
    <circle cx="84" cy="322" r="17" fill="url(#ljBrand)" filter="url(#ljSh)"/>
    <path d="M78 322l4 4 8-9" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="118" y="316" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" fill="#101b16">Repay to a cleared balance</text>
    <text x="118" y="334" font-family="Inter, system-ui, sans-serif" font-size="10.5" fill="#5c6b64">Fixed monthly repayment; the balance is visible throughout.</text>
  </g>
</svg>
